version: "3.8"

services:
  app:
    build: .
    container_name: opencart-app
    restart: unless-stopped
    ports:
      - "81:80"
    environment:
      TZ: Asia/Tokyo
    volumes:
      # 持久化上传图片、缓存、日志、会话
      - opencart_image:/var/www/html/image
      - opencart_storage:/var/www/html/system/storage
    depends_on:
      - db

  db:
    image: mariadb:10.6
    container_name: opencart-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: opencart
      MYSQL_USER: opencart
      MYSQL_PASSWORD: opencart
    volumes:
      - opencart_db:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  opencart_image:
  opencart_storage:
  opencart_db:
